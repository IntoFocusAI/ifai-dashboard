[build]
  command = "npm run build"
  publish = ".next"

# TEST_LOGIN_EMAIL is an email address, not a secret. Netlify's secrets
# scan fails every build because that address also appears in the source.
# Skip that one key; every other environment variable is still scanned.
# To undo, delete this block.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "TEST_LOGIN_EMAIL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
