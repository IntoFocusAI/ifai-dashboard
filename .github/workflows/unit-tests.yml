name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # Parity chunk C8: lists code that branches on a client name. Report only (always exit 0)
      # until the parity rounds clear docs/client-parity-gaps.md; then switch to `npm run lint:clients`.
      - name: Client branch lint (report only)
        run: node scripts/lint-client-branches.mjs --report
